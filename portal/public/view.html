<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/favicon.png">
<title>Your M2D Handover Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,400..700&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEEAE6;--bar:#FFFFFF;--ink:#262422;--muted:#675F58;--line:#E5DED6;--accent:#D9731F;--accent-ink:#A4500E;--on:#FFFFFF}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar img{height:20px;width:auto;display:block}
.bar .who{font-size:13px;color:var(--muted);flex:1;min-width:120px;overflow-wrap:anywhere}
.bar .who strong{color:var(--ink)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:#F6F2EE}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;min-height:38px;font:inherit;font-weight:500;font-size:13px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--bar);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pdf{border:0;background:var(--accent);color:var(--on);border-radius:8px;padding:9px 14px;min-height:40px;font:inherit;font-weight:500;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.pdf svg{width:16px;height:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{padding:24px 0 40px;overflow-x:hidden}
.bk{zoom:var(--z,1)}
.msg{width:min(480px,calc(100% - 32px));margin:12vh auto;background:#fff;border-radius:14px;padding:32px;display:flex;flex-direction:column;gap:12px}
.msg img{width:130px}
.msg h1{font-family:'Open Sans',sans-serif;font-stretch:75%;font-weight:500;font-size:30px;color:var(--accent-ink);margin:0}
.msg p{margin:0;color:var(--muted);line-height:1.6}
.tip{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 24px}
@media print{.bar,.tip{display:none!important}body{background:#fff}.stage{padding:0}.bk{zoom:1!important}}
</style>
</head>
<body>
<header class="bar" id="bar" hidden>
  <img src="/assets/m2d-logo.png" alt="M2D">
  <div class="who" id="who"></div>
  <div class="tabs" role="tablist" aria-label="Choose document">
    <button type="button" role="tab" id="t-care" data-t="care" aria-selected="true">Home care pack</button>
    <button type="button" role="tab" id="t-handover" data-t="handover" aria-selected="false">Handover record</button>
  </div>
  <button class="pdf" type="button" id="pdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"></path></svg>Save as PDF</button>
</header>
<main class="stage" id="stage"><p class="tip">Loading your pack…</p></main>
<p class="tip" id="tip" hidden>To save a PDF, press Save as PDF and choose “Save as PDF” as the printer. On a phone, use Share › Print, then share the preview.</p>
<script src="/assets/pack.js"></script>
<script>
(function(){
  var token=(location.pathname.match(/^\/h\/([A-Za-z0-9_-]{20,40})\/?$/)||[])[1];
  var data=null, which="care";
  var style=document.createElement("style");style.textContent=BK_CSS;document.head.appendChild(style);

  function fail(title,text){document.getElementById("stage").innerHTML='<div class="msg"><img src="/assets/m2d-logo.png" alt="M2D"><h1>'+esc(title)+'</h1><p>'+esc(text)+'</p></div>'}
  function fit(){var bk=document.querySelector(".bk");if(!bk)return;var w=document.documentElement.clientWidth-16;bk.style.setProperty("--z",String(Math.min(1,w/794)))}
  function render(){
    var h=data.handover, s=data.settings||{};
    document.getElementById("stage").innerHTML=which==="care"?careDoc(h,s):handoverDoc(h,s);
    document.title=(which==="care"?"Home Care Pack":"Handover Record")+" · "+(h.customer.name||"M2D");
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(b){b.setAttribute("aria-selected",String(b.getAttribute("data-t")===which))});
    fit();
  }
  if(!token){fail("Link not found","This link isn’t complete. Please check the message from your M2D designer, or ask them to send it again.");return}
  fetch("/api/public/"+token,{credentials:"omit"}).then(function(r){
    if(r.status===404)throw "gone";if(!r.ok)throw "err";return r.json();
  }).then(function(j){
    data=j;var c=j.handover.customer||{};
    document.getElementById("who").innerHTML='Prepared for <strong>'+esc(c.name||"you")+'</strong>'+(c.address?' · '+esc(c.address):'');
    document.getElementById("bar").hidden=false;document.getElementById("tip").hidden=false;
    if(location.hash==="#handover")which="handover";
    render();
  },function(e){
    if(e==="gone")fail("This link no longer works","Your designer may have sent you a newer link. Please ask them for the latest one.");
    else fail("Couldn’t load your pack","Please check your internet connection and refresh the page.");
  });
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-t]");if(b&&data){which=b.getAttribute("data-t");history.replaceState(null,"",which==="handover"?"#handover":location.pathname);render();window.scrollTo(0,0);return}
    if(e.target.closest("#pdf"))window.print();
  });
  window.addEventListener("resize",fit);
})();
</script>
</body>
</html>
